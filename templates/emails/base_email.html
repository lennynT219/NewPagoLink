<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PagoLink — {% block title %}Notificación{% endblock %}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f6fa; font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #374151;">

    <!-- ═══ Header with Navy Background ═══ -->
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #162447;">
        <tr>
            <td align="center" style="padding: 32px 20px;">
                <table width="600" cellpadding="0" cellspacing="0">
                    <tr>
                        <td align="center">
                            <!-- Teal logo square -->
                            <div style="display: inline-block; width: 48px; height: 48px; background-color: #00c9a7; border-radius: 12px; text-align: center; line-height: 48px; margin-bottom: 12px;">
                                <span style="font-size: 24px; color: #162447;">&#x1f4b3;</span>
                            </div>
                            <h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: -0.5px;">
                                Pago<span style="font-weight: 300; opacity: 0.8;">Link</span>
                            </h1>
                            <p style="margin: 8px 0 0 0; color: rgba(255, 255, 255, 0.6); font-size: 13px;">
                                Tu aliado en pagos digitales
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <!-- ═══ Teal Accent Line ═══ -->
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td style="height: 4px; background-color: #00c9a7;"></td>
        </tr>
    </table>

    <!-- ═══ White Content Area ═══ -->
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f6fa;">
        <tr>
            <td align="center" style="padding: 32px 20px 48px;">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);">
                    <tr>
                        <td style="padding: 40px 32px;">

                            {% block content %}
                            <!-- Child template content goes here -->
                            {% endblock %}

                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <!-- ═══ Footer with Navy Background ═══ -->
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #162447;">
        <tr>
            <td align="center" style="padding: 24px 20px;">
                <p style="margin: 0; color: rgba(255, 255, 255, 0.5); font-size: 12px;">
                    &copy; {% now "Y" %} PagoLink. Todos los derechos reservados.
                </p>
                <p style="margin: 6px 0 0 0; color: rgba(255, 255, 255, 0.3); font-size: 11px;">
                    Correo automático — por favor no respondas a este mensaje.
                </p>
            </td>
        </tr>
    </table>

</body>
</html>
