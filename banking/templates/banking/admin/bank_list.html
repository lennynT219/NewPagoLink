{% extends 'dashboard/layouts/base.html' %}

{% block content %}
<div class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1 class="m-0 text-dark">Gestión de Bancos</h1>
            </div>
        </div>
    </div>
</div>

<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6">
                <div class="card card-primary card-outline">
                    <div class="card-header">
                        <h3 class="card-title">Catálogo de Entidades Financieras</h3>
                        <div class="card-tools">
                            <a href="{% url 'banking:bank_create' %}" class="btn btn-success btn-sm">
                                <i class="fas fa-plus"></i> Añadir Banco
                            </a>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th style="width: 10px">#</th>
                                    <th>Nombre del Banco</th>
                                    <th style="width: 40px">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for bank in banks %}
                                <tr>
                                    <td>{{ bank.id }}</td>
                                    <td>{{ bank.title }}</td>
                                    <td>
                                        <button class="btn btn-danger btn-xs"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                                {% empty %}
                                <tr>
                                    <td colspan="3" class="text-center text-muted">No hay bancos registrados en el sistema.</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
