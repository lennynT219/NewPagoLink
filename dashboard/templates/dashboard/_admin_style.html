<style>
.admin-page { max-width:1440px; margin:0 auto; }
.admin-header { display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); flex-wrap:wrap; margin-bottom:var(--space-6); }

.admin-icon { background:var(--gray-50); color:var(--navy-700); }
.admin-icon-teal { background:rgba(0,201,167,.12); color:var(--teal-dark); }
