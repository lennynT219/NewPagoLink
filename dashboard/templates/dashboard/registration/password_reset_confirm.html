{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PagoLink | Cambiar Contraseña</title>
  <link rel="stylesheet" href="{% static 'css/adminlte.min.css' %}">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <a href="/" class="h1"><b>Pago</b>Link</a>
    </div>
    <div class="card-body">
      {% if validlink %}
      <p class="login-box-msg">Ingresa tu nueva contraseña a continuación.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-block">Cambiar contraseña</button>
          </div>
        </div>
      </form>
      {% else %}
      <div class="alert alert-danger text-center">
        <h5><i class="icon fas fa-ban"></i> ¡Enlace Inválido!</h5>
        El enlace de recuperación ha expirado o ya ha sido utilizado.
      </div>
      <a href="{% url 'dashboard:password_reset' %}" class="btn btn-default btn-block">Solicitar uno nuevo</a>
      {% endif %}
    </div>
  </div>
</div>
</body>
</html>
