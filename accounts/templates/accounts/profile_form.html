{% extends 'dashboard/layouts/base.html' %}

{% block title %}Mi Perfil - PagoLink{% endblock %}

{% block content %}

<!-- Page Header -->
<div class="mb-6">
    <h1 style="font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); color: var(--navy-900);">
        <i class="fas fa-user-cog" style="color: var(--teal); margin-right: var(--space-2);"></i>
        Editar Perfil
    </h1>
</div>

<div style="max-width: 700px; margin: 0 auto;">

    <!-- Profile Form Card -->
    <div class="card-modern">
        <form method="post">
            {% csrf_token %}

            <!-- Names row -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4);">
                <div>
                    <label style="display: block; font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); color: var(--gray-700); margin-bottom: var(--space-2);">
                        Nombres
                    </label>
                    {{ form.firstname }}
                </div>
                <div>
                    <label style="display: block; font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); color: var(--gray-700); margin-bottom: var(--space-2);">
                        Apellidos
                    </label>
                    {{ form.lastname }}
                </div>
            </div>

            <!-- Email -->
            <div style="margin-bottom: var(--space-4);">
                <label style="display: block; font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); color: var(--gray-700); margin-bottom: var(--space-2);">
                    Correo Electrónico (No editable)
                </label>
                {{ form.email }}
            </div>

            <!-- Identification + Phone row -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-6);">
                <div>
                    <label style="display: block; font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); color: var(--gray-700); margin-bottom: var(--space-2);">
                        Identificación (No editable)
                    </label>
                    {{ form.identification }}
                </div>
                <div>
                    <label style="display: block; font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); color: var(--gray-700); margin-bottom: var(--space-2);">
                        Teléfono Celular
                    </label>
                    {{ form.phone }}
                </div>
            </div>

            <!-- Buttons -->
            <div style="display: flex; justify-content: flex-end; gap: var(--space-3); border-top: 1px solid var(--gray-200); padding-top: var(--space-6);">
                <a href="{% url 'dashboard:dashboard' %}" class="btn-secondary" style="padding: 10px 24px; font-size: var(--font-size-sm);">
                    Cancelar
                </a>
                <button type="submit" class="btn-primary-auth" style="padding: 12px 32px; font-size: var(--font-size-sm);">
                    <i class="fas fa-save" style="margin-right: var(--space-2);"></i>
                    Actualizar Datos
                </button>
            </div>
        </form>
    </div>

</div>

<!-- Responsive: stack form columns on mobile -->
<style>
    @media (max-width: 576px) {
        div[style*="grid-template-columns: 1fr 1fr"] {
            grid-template-columns: 1fr !important;
        }
    }
</style>

{% endblock %}
